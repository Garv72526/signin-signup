<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Auth App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h2 {
            color: #333;
        }

        .container {
            background-color: white;
            padding: 25px 30px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #information {
            margin-top: 10px;
            font-weight: bold;
        }

        .logout {
            margin-top: 10px;
            width: 100%;
            background-color: #e53935;
        }

        .logout:hover {
            background-color: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Signup</h2>
        <input id="signup-username" type="text" placeholder="Username" name="username">
        <input type="password" id="signup-password" placeholder="Password" name="password">
        <button onclick="signup()">Signup</button>
    </div>

    <div class="container">
        <h2>Signin</h2>
        <input type="text" id="signin-username" placeholder="Username" name="username">
        <input type="password" id="signin-password" placeholder="Password" name="password">
        <button onclick="signin()">Signin</button>
    </div>

    <div class="container">
        <h2>User Information</h2>
        <div id="information">Not logged in</div>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <script>
        async function signup() {
            const username = document.getElementById("signup-username").value
            const password = document.getElementById("signup-password").value
            try {
                let response = await axios.post("http://localhost:3000/signup", {
                    username: username,
                    password: password
                })
                alert(response.data.message)
            }
            catch (error) {
                console.error("Error while signing up: ", error)
            }
        }

        async function signin() {
            const username = document.getElementById("signin-username").value
            const password = document.getElementById("signin-password").value
            try {
                let response = await axios.post("http://localhost:3000/signin", {
                    username: username,
                    password: password
                })
                if (response.data.token) {
                    localStorage.setItem("token", response.data.token)
                    alert("You are signed in")
                    getUserInformation();
                } else {
                    alert(response.data.message)
                }
            }
            catch (error) {
                console.error("Error while signing in:", error)
            }
        }

        async function getUserInformation() {
            try {
                let response = await axios.get("http://localhost:3000/me", {
                    headers: {
                        token: localStorage.getItem("token")
                    }
                })
                const infoDiv = document.getElementById("information")
                if (response.data.username) {
                    infoDiv.innerHTML = `Username: ${response.data.username}<br>Password: ${response.data.password}`
                } else {
                    infoDiv.innerHTML = response.data.message;
                }
            }
            catch (error) {
                console.error("Error while fetching user information")
            }
        }

        function logout() {
            localStorage.removeItem("token")
            alert("You have logged out")
            document.getElementById("information").innerText = "Not logged in"
        }

        getUserInformation()
    </script>
</body>

</html>
